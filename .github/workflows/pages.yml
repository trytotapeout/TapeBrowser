# 把 github_pages/ 目录发布到 GitHub Pages：main 分支上这个目录有改动时自动发布，也可以手动运行
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ['github_pages/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github_pages
      - id: deployment
        uses: actions/deploy-pages@v4
